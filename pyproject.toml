[project]
name = "pharos"
version = "0.1.0"
description = "Local-first data platform: prices, macro, and fundamentals as Parquet, checked before published."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
pharos = "pharos.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
